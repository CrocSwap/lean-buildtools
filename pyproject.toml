[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-buildtools"
version = "0.2.0"
description = "Capped Lean builds and declaration resource profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "lean-buildtools contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/CrocSwap/lean-buildtools"
Issues = "https://github.com/CrocSwap/lean-buildtools/issues"

[project.scripts]
lean-buildtools = "lean_buildtools.cli:main"

[tool.setuptools]
packages = ["lean_buildtools"]
include-package-data = false

[tool.setuptools.package-data]
lean_buildtools = ["lean/*.lean", "lean/*.c"]
